<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4E1129">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Contagem de inventário do grupo — Adega do Leo, Cais 56 e Moscatel.">
<title>Inventário do Grupo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --vinho:#6B1F3A; --vinho-forte:#4E1129; --moscatel:#B8802F; --moscatel-claro:#E8D2A8;
  --chao:#F7F4F1; --superficie:#FFFFFF; --superficie-2:#F1ECE8;
  --tinta:#241A1D; --tinta-2:#5C4E51; --tinta-3:#8A7B7E;
  --linha:#E2D9D5; --linha-forte:#CFC2BD;
  --ok:#2E6F52; --ok-fundo:#E4F0EA; --falta:#9A6516; --falta-fundo:#FBEFD9;
  --sombra:0 1px 2px rgba(36,26,29,.06), 0 8px 24px -16px rgba(36,26,29,.28);
  --topo-fundo:#4E1129; --topo-tinta:#FFF1F5; --bt-tinta:#FFFFFF;
  --r:12px; --max:720px;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --disp:"Bricolage Grotesque","IBM Plex Sans",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --vinho:#D4879F; --vinho-forte:#EBB0C1; --moscatel:#D9A85C; --moscatel-claro:#7A5A28;
  --chao:#171214; --superficie:#211A1D; --superficie-2:#2B2226;
  --tinta:#F3EAE7; --tinta-2:#C4B4B7; --tinta-3:#938286;
  --linha:#372C31; --linha-forte:#4A3B40;
  --ok:#7FC5A2; --ok-fundo:#1E3A2C; --falta:#E5B96B; --falta-fundo:#3A2C15;
  --topo-fundo:#2E1017; --topo-tinta:#F6E3E8; --bt-tinta:#2B1119;
  --sombra:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --vinho:#D4879F; --vinho-forte:#EBB0C1; --moscatel:#D9A85C; --moscatel-claro:#7A5A28;
  --chao:#171214; --superficie:#211A1D; --superficie-2:#2B2226;
  --tinta:#F3EAE7; --tinta-2:#C4B4B7; --tinta-3:#938286;
  --linha:#372C31; --linha-forte:#4A3B40;
  --ok:#7FC5A2; --ok-fundo:#1E3A2C; --falta:#E5B96B; --falta-fundo:#3A2C15;
  --topo-fundo:#2E1017; --topo-tinta:#F6E3E8; --bt-tinta:#2B1119;
  --sombra:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{margin:0;background:var(--chao);color:var(--tinta);font-family:var(--sans);
  font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{max-width:var(--max);margin:0 auto;padding:0 16px 140px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--vinho);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- topo ---------- */
.topo{position:sticky;top:0;z-index:30;background:var(--topo-fundo);color:var(--topo-tinta);
  box-shadow:0 1px 0 rgba(0,0,0,.15)}
.topo-in{max-width:var(--max);margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.marca{font-family:var(--disp);font-weight:700;font-size:17px;letter-spacing:-.01em;margin:0}
.marca small{display:block;font-family:var(--sans);font-weight:400;font-size:11.5px;
  letter-spacing:.08em;text-transform:uppercase;opacity:.72;margin-top:1px}
.voltar{background:rgba(255,255,255,.12);border:0;color:inherit;width:36px;height:36px;
  border-radius:9px;display:grid;place-items:center;flex:none;font-size:18px;line-height:1}
.voltar:hover{background:rgba(255,255,255,.2)}
.progresso{margin-left:auto;text-align:right;font-family:var(--mono);font-size:13px;font-weight:600}
.progresso span{display:block;font-family:var(--sans);font-size:10.5px;font-weight:400;
  letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.barra{height:3px;background:rgba(255,255,255,.18)}
.barra i{display:block;height:100%;background:var(--moscatel-claro);width:0;transition:width .25s}

/* ---------- ecrã inicial ---------- */
.intro{padding:26px 0 8px}
.intro h2{font-family:var(--disp);font-weight:700;font-size:26px;line-height:1.15;
  letter-spacing:-.02em;margin:0 0 6px;text-wrap:balance}
.intro p{margin:0 0 22px;color:var(--tinta-2);font-size:14.5px;max-width:52ch}
.campos{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:26px}
label.campo{display:block}
label.campo span{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--tinta-3);margin-bottom:5px;font-weight:500}
input[type=text],input[type=date],input[type=search]{width:100%;padding:11px 12px;border:1px solid var(--linha-forte);
  border-radius:10px;background:var(--superficie);color:var(--tinta);font:inherit;font-size:15.5px}
input::placeholder{color:var(--tinta-3)}
.casa{margin-bottom:14px}
.casa h3{font-family:var(--disp);font-size:13px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--vinho);margin:0 0 8px;display:flex;align-items:center;gap:8px}
.casa h3::after{content:"";flex:1;height:1px;background:var(--linha)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sec{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--superficie);
  border:1px solid var(--linha);border-radius:var(--r);padding:14px;box-shadow:var(--sombra);
  transition:border-color .15s,transform .1s}
.sec:hover{border-color:var(--vinho)}
.sec:active{transform:scale(.99)}
.sec b{font-family:var(--disp);font-size:16.5px;font-weight:700;letter-spacing:-.01em}
.sec em{font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--tinta-3)}
.sec .ult{font-size:11.5px;color:var(--tinta-2)}
.sec.vazia b{color:var(--tinta-3)}
.aviso{background:var(--falta-fundo);color:var(--falta);border-radius:10px;padding:10px 12px;
  font-size:13px;margin:0 0 18px;border:1px solid rgba(154,101,22,.25)}

/* ---------- contagem ---------- */
.ferramentas{position:sticky;top:57px;z-index:20;background:var(--chao);padding:12px 0 10px;
  display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--linha)}
.ferramentas input{flex:1}
.filtro{border:1px solid var(--linha-forte);background:var(--superficie);border-radius:999px;
  padding:9px 14px;font-size:13.5px;font-weight:500;white-space:nowrap}
.filtro[aria-pressed=true]{background:var(--vinho);color:var(--bt-tinta);border-color:var(--vinho)}
.grupo{margin-top:22px}
.grupo>h4{font-family:var(--disp);font-size:12.5px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--tinta-2);margin:0 0 8px;display:flex;gap:8px;align-items:baseline}
.grupo>h4 i{font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--tinta-3);margin-left:auto}
.lista{background:var(--superficie);border:1px solid var(--linha);border-radius:var(--r);overflow:hidden}
.linha{display:grid;grid-template-columns:1fr 104px 34px;gap:10px;align-items:center;
  padding:9px 10px 9px 13px;border-top:1px solid var(--linha)}
.linha:first-child{border-top:0}
.linha.feito{background:linear-gradient(90deg,var(--ok-fundo),transparent 60%)}
.nome{min-width:0}
.nome b{display:block;font-weight:500;font-size:14.8px;line-height:1.25;word-break:break-word}
.nome span{font-family:var(--mono);font-size:11px;color:var(--tinta-3);text-transform:none}
.nome .obs{display:block;font-size:11.5px;color:var(--moscatel);margin-top:2px}
.qtd{width:100%;padding:9px 8px;text-align:right;border:1px solid var(--linha-forte);border-radius:9px;
  background:var(--superficie);color:var(--tinta);font-family:var(--mono);font-size:16px;font-weight:600;
  font-variant-numeric:tabular-nums}
.qtd:focus{border-color:var(--vinho);background:var(--superficie)}
.linha.feito .qtd{border-color:var(--ok);color:var(--ok)}
.soma{display:block;font-family:var(--mono);font-size:10.5px;color:var(--ok);text-align:right;margin-top:2px}
.nota{border:0;background:transparent;color:var(--tinta-3);width:34px;height:34px;border-radius:9px;
  display:grid;place-items:center;font-size:15px}
.nota:hover{background:var(--superficie-2);color:var(--vinho)}
.nota.tem{color:var(--moscatel)}
.novo{width:100%;margin-top:10px;padding:12px;border:1px dashed var(--linha-forte);border-radius:var(--r);
  background:transparent;color:var(--vinho);font-weight:500;font-size:14px}
.novo:hover{background:var(--superficie);border-color:var(--vinho)}
.vazio{padding:40px 16px;text-align:center;color:var(--tinta-3);font-size:14px}

/* ---------- rodapé ---------- */
.rodape{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--superficie);
  border-top:1px solid var(--linha);padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  box-shadow:0 -8px 24px -18px rgba(36,26,29,.5)}
.rodape-in{max-width:var(--max);margin:0 auto;display:flex;gap:10px;align-items:center}
.estado{font-size:11.5px;color:var(--tinta-3);flex:1;min-width:0}
.estado b{display:block;color:var(--tinta-2);font-weight:500;font-size:12.5px}
.bt{border:0;border-radius:11px;padding:13px 20px;font-weight:600;font-size:15px;background:var(--vinho);color:var(--bt-tinta)}
.bt:hover{background:var(--vinho-forte)}
.bt.sec2{background:var(--superficie-2);color:var(--tinta)}
.bt[disabled]{opacity:.45;cursor:not-allowed}

/* ---------- modal ---------- */
.veu{position:fixed;inset:0;background:rgba(36,26,29,.55);z-index:50;display:grid;place-items:end center;padding:0}
.folha{background:var(--superficie);width:100%;max-width:var(--max);border-radius:16px 16px 0 0;
  padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.folha h3{font-family:var(--disp);font-size:19px;margin:0 0 4px;letter-spacing:-.01em}
.folha p{margin:0 0 16px;color:var(--tinta-2);font-size:14px}
.folha .acoes{display:flex;gap:10px;margin-top:18px}
.folha .acoes .bt{flex:1;text-align:center}
.resumo{border:1px solid var(--linha);border-radius:10px;overflow:hidden;margin-top:6px}
.resumo div{display:flex;justify-content:space-between;padding:9px 12px;border-top:1px solid var(--linha);font-size:14px}
.resumo div:first-child{border-top:0}
.resumo b{font-family:var(--mono);font-variant-numeric:tabular-nums}
.enviadas{margin-top:26px}
.enviadas h4{font-family:var(--disp);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--tinta-2);margin:0 0 8px}
.env{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;background:var(--superficie);
  border:1px solid var(--linha);border-radius:10px;margin-bottom:6px;font-size:13.5px}
.env span{color:var(--tinta-3);font-family:var(--mono);font-size:12px}
.oculto{display:none!important}
</style>
</head>
<body>
<header class="topo">
  <div class="topo-in">
    <button class="voltar oculto" id="btVoltar" aria-label="Voltar">&#8592;</button>
    <h1 class="marca" id="titulo">Inventário do Grupo<small id="subtitulo">Adega do Leo · Cais 56 · Moscatel</small></h1>
    <div class="progresso oculto" id="prog"><b id="progNum">0/0</b><span>contados</span></div>
  </div>
  <div class="barra"><i id="barra"></i></div>
</header>

<main class="wrap">
  <!-- ECRÃ 1 -->
  <section id="ecraInicio">
    <div class="intro">
      <h2>Contagem de armazém</h2>

      <div id="avisoOffline" class="aviso oculto"></div>
      <div class="campos">
        <label class="campo"><span>Data da contagem</span><input type="date" id="inData"></label>
        <label class="campo"><span>Quem conta</span><input type="text" id="inContador" placeholder="Nome do gerente" autocomplete="name"></label>
      </div>
    </div>
    <div id="casas"></div>
    <div class="enviadas oculto" id="blocoEnviadas">
      <h4>Últimas contagens fechadas</h4>
      <div id="listaEnviadas"></div>
    </div>
  </section>

  <!-- ECRÃ 2 -->
  <section id="ecraContagem" class="oculto">
    <div class="ferramentas">
      <input type="search" id="busca" placeholder="Procurar artigo…" autocomplete="off">
      <button class="filtro" id="btFiltro" aria-pressed="false">Por contar</button>
    </div>
    <div id="listas"></div>
    <button class="novo" id="btNovo">+ Artigo que não está na lista</button>
  </section>
</main>

<div class="rodape oculto" id="rodape">
  <div class="rodape-in">
    <div class="estado"><b id="estadoTit">Rascunho</b><span id="estadoSub">nada por gravar</span></div>
    <button class="bt sec2" id="btCopiar">Copiar</button>
    <button class="bt" id="btFechar">Fechar contagem</button>
  </div>
</div>

<div class="veu oculto" id="veu"><div class="folha" id="folha"></div></div>

<script>
/* ------------------------------------------------------------------
   Inventário do Grupo — app de contagem
   Envia as contagens fechadas para a Folha de Cálculo do Drive
   através do Apps Script publicado em CONFIG.url
------------------------------------------------------------------ */
const CONFIG = {
  url: 'https://script.google.com/macros/s/AKfycbwTu3M0P3WrlEE2zOZiTZlmYoaRywuBJJjmE2Py8cO4vOk9lnZD2XrlW6ZBp0NsZ3Ud7A/exec',
  codigo: '2530'                // código que o gerente escreve uma vez
};

const $ = s => document.querySelector(s);
const slug = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const hoje = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const chave = it => it.categoria + '|' + it.produto;
const ler = (k, alt) => { try{ const v = localStorage.getItem(k); return v === null ? alt : JSON.parse(v); }catch(e){ return alt; } };
const guardar = (k, v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };

let secAtual = null, extras = [], valores = {}, filtro = false, busca = '', gravarTimer = null;
let porEnviar = ler('inv.fila', []);      // contagens fechadas que ainda não chegaram ao Drive
let historico = ler('inv.historico', []); // últimas contagens enviadas com sucesso

/* ---------- parcelas: "10+12" -> 22 ---------- */
function soma(txt){
  if(txt === null || txt === undefined) return null;
  const t = String(txt).trim();
  if(!t) return null;
  const partes = t.replace(/,/g,'.').split('+').map(p => p.trim()).filter(Boolean);
  let tot = 0;
  for(const p of partes){
    if(!/^\d*\.?\d+$/.test(p)) return NaN;
    tot += parseFloat(p);
  }
  return Math.round(tot * 1000) / 1000;
}
const temParcelas = t => String(t||'').includes('+');

/* ---------- arranque ---------- */
$('#inData').value = hoje();
$('#inContador').value = ler('inv.contador', '');
$('#inContador').addEventListener('input', e => guardar('inv.contador', e.target.value));
desenhaCasas();
desenhaHistorico();
if(porEnviar.length) enviaFila();

/* ---------- ecrã 1 ---------- */
function desenhaCasas(){
  const casas = [];
  CATALOGO.forEach(s => { if(!casas.includes(s.armazem)) casas.push(s.armazem); });
  const ultimas = {};
  historico.forEach(c => { const k = slug(c.armazem)+'__'+slug(c.seccao); if(!ultimas[k]) ultimas[k] = c; });
  $('#casas').innerHTML = casas.map(c => `
    <div class="casa">
      <h3>${c}</h3>
      <div class="duo">
        ${CATALOGO.filter(s => s.armazem === c).map(s => {
          const k = slug(s.armazem)+'__'+slug(s.seccao);
          const ex = (ler('inv.extras.' + k, []) || []).length;
          const rasc = ler('inv.rascunho.' + k, null);
          const n = s.itens.length + ex;
          return `<button class="sec ${n ? '' : 'vazia'}" data-arm="${s.armazem}" data-sec="${s.seccao}">
            <b>${s.seccao}</b>
            <em>${n ? n + ' artigos' : 'lista por criar'}</em>
            <span class="ult">${rasc ? 'contagem a meio' : (ultimas[k] ? 'última: ' + dataPT(ultimas[k].data) : '')}</span>
          </button>`;
        }).join('')}
      </div>
    </div>`).join('');
  document.querySelectorAll('.sec').forEach(b => b.addEventListener('click', () => abre(b.dataset.arm, b.dataset.sec)));
}
const dataPT = d => String(d||'').split('-').reverse().join('/');

function desenhaHistorico(){
  const linhas = porEnviar.map(c => ({c, pendente:true})).concat(historico.slice(0,6).map(c => ({c, pendente:false})));
  if(!linhas.length){ $('#blocoEnviadas').classList.add('oculto'); return; }
  $('#blocoEnviadas').classList.remove('oculto');
  $('#listaEnviadas').innerHTML = linhas.map(({c, pendente}) => `
    <div class="env">
      <div><b>${c.armazem} · ${c.seccao}</b><br><span>${c.contador || 'sem nome'}</span></div>
      <div style="text-align:right"><span>${dataPT(c.data)}</span><br>
        <span style="color:${pendente ? 'var(--falta)' : 'var(--ok)'}">${pendente ? 'por enviar' : c.contados + ' artigos'}</span></div>
    </div>`).join('');
}

/* ---------- abrir secção ---------- */
function abre(arm, sec){
  secAtual = CATALOGO.find(s => s.armazem === arm && s.seccao === sec);
  valores = {}; filtro = false; busca = '';
  extras = ler('inv.extras.' + id(), []) || [];
  const rasc = ler('inv.rascunho.' + id(), null);
  if(rasc){
    valores = rasc.valores || {};
    if(rasc.data) $('#inData').value = rasc.data;
  }
  $('#busca').value = ''; $('#btFiltro').setAttribute('aria-pressed','false');
  $('#titulo').innerHTML = `${arm}<small>${sec} · ${dataPT($('#inData').value)}</small>`;
  $('#ecraInicio').classList.add('oculto');
  $('#ecraContagem').classList.remove('oculto');
  $('#rodape').classList.remove('oculto');
  $('#btVoltar').classList.remove('oculto');
  $('#prog').classList.remove('oculto');
  window.scrollTo(0,0);
  marca(rasc ? 'Contagem a meio' : 'Rascunho', rasc ? 'retomada de ' + dataPT(rasc.data) : 'grava-se sozinha enquanto conta');
  desenhaLista();
}
const id = () => slug(secAtual.armazem) + '__' + slug(secAtual.seccao);
const todosItens = () => secAtual.itens.concat(extras);

function desenhaLista(){
  const itens = todosItens();
  const q = busca.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const visiveis = itens.filter(it => {
    const v = valores[chave(it)];
    if(filtro && v && String(v.q||'').trim() !== '') return false;
    if(!q) return true;
    return (it.produto + ' ' + it.categoria).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').includes(q);
  });
  const cats = [];
  visiveis.forEach(it => { if(!cats.includes(it.categoria)) cats.push(it.categoria); });
  $('#listas').innerHTML = cats.length ? cats.map(cat => {
    const doGrupo = visiveis.filter(it => it.categoria === cat);
    const feitos = doGrupo.filter(it => (valores[chave(it)]||{}).q).length;
    return `<section class="grupo"><h4>${cat}<i>${feitos}/${doGrupo.length}</i></h4>
      <div class="lista">${doGrupo.map(linha).join('')}</div></section>`;
  }).join('') : `<p class="vazio">${itens.length ? 'Nada encontrado.' : 'Esta lista ainda não tem artigos. Use o botão em baixo para os acrescentar à medida que conta.'}</p>`;
  ligaEventos();
  atualizaProgresso();
}

function linha(it){
  const k = chave(it), v = valores[k] || {};
  const feito = String(v.q||'').trim() !== '';
  const total = soma(v.q);
  return `<div class="linha ${feito ? 'feito' : ''}" data-k="${encodeURIComponent(k)}">
    <div class="nome"><b>${it.produto}</b><span>${it.unidade || ''}</span>
      ${v.obs ? `<span class="obs">${v.obs}</span>` : ''}</div>
    <div><input class="qtd" inputmode="decimal" autocomplete="off" placeholder="—" value="${(v.q||'').replace(/"/g,'&quot;')}">
      ${temParcelas(v.q) && !isNaN(total) && total !== null ? `<span class="soma">= ${total}</span>` : ''}</div>
    <button class="nota ${v.obs ? 'tem' : ''}" aria-label="Observação">&#9998;</button>
  </div>`;
}

function ligaEventos(){
  document.querySelectorAll('.linha').forEach(l => {
    const k = decodeURIComponent(l.dataset.k);
    const inp = l.querySelector('.qtd');
    inp.addEventListener('input', () => {
      valores[k] = Object.assign({}, valores[k], {q: inp.value});
      l.classList.toggle('feito', inp.value.trim() !== '');
      const t = soma(inp.value);
      let sp = l.querySelector('.soma');
      if(temParcelas(inp.value) && !isNaN(t) && t !== null){
        if(!sp){ sp = document.createElement('span'); sp.className = 'soma'; inp.parentNode.appendChild(sp); }
        sp.textContent = '= ' + t;
      } else if(sp) sp.remove();
      const g = l.closest('.grupo');
      if(g) g.querySelector('h4 i').textContent = g.querySelectorAll('.linha.feito').length + '/' + g.querySelectorAll('.linha').length;
      atualizaProgresso(); agendaGravar();
    });
    l.querySelector('.nota').addEventListener('click', () => pedeNota(k));
  });
}

function pedeNota(k){
  const v = valores[k] || {};
  abreFolha(`<h3>Observação</h3><p>${k.split('|')[1]}</p>
    <input type="text" id="inNota" placeholder="ex.: 2 avariados, embalagem aberta" value="${(v.obs||'').replace(/"/g,'&quot;')}">
    <div class="acoes"><button class="bt sec2" data-fecha>Cancelar</button><button class="bt" id="btNota">Guardar</button></div>`);
  setTimeout(() => $('#inNota').focus(), 60);
  $('#btNota').addEventListener('click', () => {
    valores[k] = Object.assign({}, valores[k], {obs: $('#inNota').value.trim()});
    fechaFolha(); desenhaLista(); agendaGravar();
  });
}

function atualizaProgresso(){
  const itens = todosItens();
  const feitos = itens.filter(it => String((valores[chave(it)]||{}).q||'').trim() !== '').length;
  $('#progNum').textContent = feitos + '/' + itens.length;
  $('#barra').style.width = itens.length ? (feitos / itens.length * 100) + '%' : '0';
  $('#btFechar').disabled = feitos === 0;
}

/* ---------- rascunho automático ---------- */
function agendaGravar(){
  clearTimeout(gravarTimer);
  gravarTimer = setTimeout(grava, 700);
}
function grava(){
  guardar('inv.rascunho.' + id(), {armazem: secAtual.armazem, seccao: secAtual.seccao,
    data: $('#inData').value, contador: $('#inContador').value.trim(), valores: valores,
    atualizadoEm: new Date().toISOString()});
  marca('Contagem guardada', 'no telemóvel · ' + new Date().toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'}));
}
const marca = (t, s) => { $('#estadoTit').textContent = t; $('#estadoSub').textContent = s; };

/* ---------- novo artigo ---------- */
$('#btNovo').addEventListener('click', () => {
  const cats = [];
  todosItens().forEach(it => { if(!cats.includes(it.categoria)) cats.push(it.categoria); });
  abreFolha(`<h3>Artigo novo</h3><p>Fica na lista desta secção e segue com a contagem para a folha do Drive.</p>
    <label class="campo"><span>Produto</span><input type="text" id="nProd" placeholder="ex.: Vinagre de sidra"></label>
    <div class="campos" style="margin-top:12px">
      <label class="campo"><span>Unidade</span><input type="text" id="nUni" placeholder="un / kg / L"></label>
      <label class="campo"><span>Categoria</span><input type="text" id="nCat" list="lstCats" placeholder="${cats[0] || 'Geral'}"></label>
    </div>
    <datalist id="lstCats">${cats.map(c => `<option value="${c}">`).join('')}</datalist>
    <div class="acoes"><button class="bt sec2" data-fecha>Cancelar</button><button class="bt" id="btAdd">Acrescentar</button></div>`);
  setTimeout(() => $('#nProd').focus(), 60);
  $('#btAdd').addEventListener('click', () => {
    const p = $('#nProd').value.trim(); if(!p) return;
    const novo = {categoria: $('#nCat').value.trim() || cats[0] || 'Geral', produto: p,
      unidade: $('#nUni').value.trim() || 'un', novo: true};
    extras.push(novo);
    guardar('inv.extras.' + id(), extras);
    fechaFolha(); desenhaLista();
    const alvo = document.querySelector(`[data-k="${encodeURIComponent(chave(novo))}"] .qtd`);
    if(alvo){ alvo.scrollIntoView({block:'center'}); alvo.focus(); }
  });
});

/* ---------- fechar contagem ---------- */
$('#btFechar').addEventListener('click', () => {
  const linhas = linhasContadas();
  const porContar = todosItens().length - linhas.length;
  abreFolha(`<h3>Fechar a contagem</h3>
    <p>${secAtual.armazem} · ${secAtual.seccao} · ${dataPT($('#inData').value)}</p>
    <div class="resumo">
      <div><span>Artigos contados</span><b>${linhas.length}</b></div>
      <div><span>Por contar</span><b>${porContar}</b></div>
      <div><span>Com observação</span><b>${linhas.filter(l => l.observacoes).length}</b></div>
      <div><span>Quem conta</span><b>${$('#inContador').value.trim() || '—'}</b></div>
    </div>
    ${porContar ? `<p style="margin-top:12px;color:var(--falta)">Os artigos por contar ficam em branco na folha, não como zero.</p>` : ''}
    <div class="acoes"><button class="bt sec2" data-fecha>Voltar</button><button class="bt" id="btConfirma">Fechar e enviar</button></div>`);
  $('#btConfirma').addEventListener('click', confirmaFecho);
});

function linhasContadas(){
  return todosItens().map(it => {
    const v = valores[chave(it)] || {};
    if(String(v.q||'').trim() === '') return null;
    const t = soma(v.q);
    return {categoria: it.categoria, produto: it.produto, unidade: it.unidade || '',
      parcelas: String(v.q).trim(), quantidade: (t === null || isNaN(t)) ? null : t,
      observacoes: v.obs || '', artigoNovo: !!it.novo};
  }).filter(Boolean);
}

async function confirmaFecho(){
  const btn = $('#btConfirma'); btn.disabled = true; btn.textContent = 'A enviar…';
  const linhas = linhasContadas();
  const contagem = {id: $('#inData').value + '__' + id() + '__' + Date.now().toString(36),
    armazem: secAtual.armazem, seccao: secAtual.seccao, data: $('#inData').value,
    contador: $('#inContador').value.trim(), contados: linhas.length,
    porContar: todosItens().length - linhas.length,
    fechadaEm: new Date().toISOString(), linhas: linhas};
  porEnviar.push(contagem); guardar('inv.fila', porEnviar);
  try{ localStorage.removeItem('inv.rascunho.' + id()); }catch(e){}
  const r = await enviaFila();
  const entrou = !porEnviar.some(c => c.id === contagem.id);
  if(entrou){
    abreFolha(`<h3>Contagem na folha</h3>
      <p>${linhas.length} artigos de ${secAtual.armazem} · ${secAtual.seccao} entraram na folha de inventário do Drive.</p>
      <div class="acoes"><button class="bt" data-fecha id="btVolta">Voltar ao início</button></div>`);
  } else {
    abreFolha(`<h3>Contagem guardada, ainda por enviar</h3>
      <p>Não deu para chegar ao Drive agora${r ? ' (' + r + ')' : ''}. A contagem ficou guardada no telemóvel e vai sozinha assim que houver rede — basta abrir a app outra vez. Também pode usar “Copiar”.</p>
      <div class="acoes"><button class="bt" data-fecha id="btVolta">Voltar ao início</button></div>`);
  }
  const bv = $('#btVolta'); if(bv) bv.addEventListener('click', voltaInicio);
}

/* ---------- envio para o Apps Script ---------- */
async function enviaFila(){
  if(!porEnviar.length) return '';
  if(!CONFIG.url || CONFIG.url.indexOf('__URL') === 0) return 'app ainda por ligar à folha';
  let erro = '';
  for(const c of porEnviar.slice()){
    try{
      const resp = await fetch(CONFIG.url, {method:'POST', redirect:'follow',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify(Object.assign({codigo: CONFIG.codigo}, c))});
      const r = await resp.json();
      if(r && r.ok){
        porEnviar = porEnviar.filter(x => x.id !== c.id);
        historico.unshift({armazem:c.armazem, seccao:c.seccao, data:c.data, contador:c.contador, contados:c.contados});
        historico = historico.slice(0,12);
        guardar('inv.fila', porEnviar); guardar('inv.historico', historico);
      } else { erro = (r && r.erro === 'codigo') ? 'código de acesso errado' : ((r && r.erro) || 'a folha recusou'); break; }
    }catch(e){ erro = 'sem rede'; break; }
  }
  desenhaHistorico();
  return erro;
}

/* ---------- copiar ---------- */
$('#btCopiar').addEventListener('click', () => copia());
function copia(){
  const cab = ['Data','Armazém','Secção','Categoria','Produto','Unidade','Quantidade','Observações','Contado por'];
  const linhas = linhasContadas().map(l => [$('#inData').value, secAtual.armazem, secAtual.seccao,
    l.categoria, l.produto, l.unidade, l.quantidade === null ? l.parcelas : l.quantidade,
    l.observacoes, $('#inContador').value.trim()].join('\t'));
  const txt = [cab.join('\t')].concat(linhas).join('\n');
  const fim = () => marca('Copiado', linhas.length + ' linhas prontas a colar');
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(fim, fim);
  else {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); try{ document.execCommand('copy'); }catch(e){} ta.remove(); fim();
  }
}

/* ---------- navegação ---------- */
$('#btVoltar').addEventListener('click', voltaInicio);
function voltaInicio(){
  fechaFolha();
  $('#ecraContagem').classList.add('oculto'); $('#rodape').classList.add('oculto');
  $('#btVoltar').classList.add('oculto'); $('#prog').classList.add('oculto');
  $('#ecraInicio').classList.remove('oculto');
  $('#titulo').innerHTML = 'Inventário do Grupo<small>Adega do Leo · Cais 56 · Moscatel</small>';
  $('#barra').style.width = '0';
  window.scrollTo(0,0);
  desenhaCasas(); desenhaHistorico();
}
$('#busca').addEventListener('input', e => { busca = e.target.value; desenhaLista(); });
$('#btFiltro').addEventListener('click', () => {
  filtro = !filtro; $('#btFiltro').setAttribute('aria-pressed', String(filtro)); desenhaLista();
});
function abreFolha(html){ $('#folha').innerHTML = html; $('#veu').classList.remove('oculto'); }
function fechaFolha(){ $('#veu').classList.add('oculto'); }
$('#veu').addEventListener('click', e => { if(e.target === $('#veu') || e.target.hasAttribute('data-fecha')) fechaFolha(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') fechaFolha(); });
window.addEventListener('online', () => { if(porEnviar.length) enviaFila(); });

/* aviso quando a app ainda não está ligada à folha do Drive */
if(!CONFIG.url || CONFIG.url.indexOf('__URL') === 0){
  const a = $('#avisoOffline');
  a.textContent = 'Esta app ainda não está ligada à folha do Drive. Pode contar e usar “Copiar”, mas o envio automático só funciona depois de a ligação estar feita.';
  a.classList.remove('oculto');
}

</script>
